inputs:
  # Pinned to the tag the installed devenv CLI reports (`devenv version`).
  # Left unpinned this input follows cachix/devenv's default branch, so
  # `devenv update` can lock modules NEWER than the CLI -- and a module newer
  # than the CLI breaks `dotenv.enable`, which this repo sets, on the NEXT
  # direnv load. Bump this tag only together with the fleet's devenv CLI, and
  # never above it.
  devenv:
    url: github:cachix/devenv?dir=src/modules&ref=v2.2.1
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  rusty-commit-saver:
    url: github:chess-seventh/rusty-commit-saver?ref=HEAD
    inputs:
      nixpkgs:
        follows: nixpkgs
allow_unfree: true
